name: Clients

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clients.yml"
      - "services/**"
      - "apps/**"

permissions:
  contents: read

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wkbin/zaomeng
          path: upstream/zaomeng
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble debug APK
        working-directory: upstream/zaomeng/kmp
        run: |
          ./gradlew :app:androidApp:assembleDebug --no-daemon --stacktrace --console=plain
      - name: Collect APK
        run: |
          mkdir -p dist
          find upstream/zaomeng/kmp -name "*.apk" -print -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  desktop:
    name: Desktop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: desktop-windows
          - os: ubuntu-latest
            artifact: desktop-linux
          - os: macos-latest
            artifact: desktop-macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wkbin/zaomeng
          path: upstream/zaomeng
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Package desktop
        working-directory: upstream/zaomeng/kmp
        shell: bash
        run: |
          ./gradlew :app:desktopApp:packageDistributionForCurrentOS --no-daemon --stacktrace --console=plain || \
          ./gradlew :app:desktopApp:packageUberJarForCurrentOS --no-daemon --stacktrace --console=plain
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          find upstream/zaomeng/kmp/app/desktopApp/build -type f \( -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.jar" \) -print -exec cp {} dist/ \; || true
          ls -la dist || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  ios-ipa:
    name: iOS IPA (TrollStore)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wkbin/zaomeng
          path: upstream/zaomeng
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Patch upstream iOS contentType
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/zaomeng/kmp/data/remote/src/iosMain/kotlin/top/wkbin/zaomeng/data/api/StreamingHttp.ios.kt")
          t = p.read_text(encoding="utf-8")
          t = t.replace("import io.ktor.client.request.contentType\n", "")
          t = t.replace(
              "contentType(ContentType.Application.Json)",
              "header(HttpHeaders.ContentType, ContentType.Application.Json.toString())",
          )
          p.write_text(t, encoding="utf-8")
          print("patched", p)
          PY
      - name: Build shared framework
        working-directory: upstream/zaomeng/kmp
        env:
          XCODE_CONFIGURATION: Release
          XCODE_SDK_NAME: iphoneos
          XCODE_PLATFORM_NAME: iphoneos
          XCODE_ARCHS: arm64
          XCODE_EFFECTIVE_ARCHS: arm64
          XCODE_PRODUCT_BUILD_VERSION: "226"
        run: |
          set -e
          ./gradlew :app:shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace --console=plain \
            -PXCODE_CONFIGURATION=Release \
            -PXCODE_SDK_NAME=iphoneos \
            -PXCODE_PLATFORM_NAME=iphoneos \
            -PXCODE_ARCHS=arm64 \
            -PXCODE_EFFECTIVE_ARCHS=arm64
          mkdir -p app/shared/build/xcode-frameworks/Release/iphoneos
          find app/shared/build -name "*.framework" -type d | head -5
          FW=$(find app/shared/build -type d -name "shared.framework" | head -1)
          if [ -n "$FW" ]; then cp -R "$FW" app/shared/build/xcode-frameworks/Release/iphoneos/; fi
      - name: Xcode build unsigned .app
        working-directory: upstream/zaomeng/kmp/iosApp
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -IDEBuildOperationMaxNumberOfConcurrentCompileTasks=2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO ARCHS=arm64 \
            FRAMEWORK_SEARCH_PATHS="$(PWD)/../app/shared/build/xcode-frameworks/Release/iphoneos" \
            build
      - name: Package IPA (no signing, TrollStore)
        run: |
          set -e
          APP=$(find upstream/zaomeng/kmp/iosApp -type d -name "Zaomeng.app" | head -1)
          if [ -z "$APP" ]; then APP=$(find upstream/zaomeng/kmp -type d -name "*.app" | head -1); fi
          echo "APP=$APP"
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          mkdir -p dist
          zip -ry dist/zaomeng-ios.ipa Payload
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-trollstore
          path: dist/*.ipa
          if-no-files-found: error
